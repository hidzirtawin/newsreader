name: Refresh news editions

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled jobs under load.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch publisher feeds and rebuild editions
        run: node scripts/refresh.mjs

      - name: Commit refreshed editions
        run: |
          git config user.name "Newsreader Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/podcasts.json data/image-cache.json data/publisher-url-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh news editions"
            git push
          fi
