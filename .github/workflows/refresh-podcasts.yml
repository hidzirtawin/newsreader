name: Refresh podcast episodes

on:
  schedule:
    # Every six hours.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-podcasts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh podcast feeds
        run: node scripts/refresh.mjs

      - name: Commit refreshed episodes
        run: |
          git config user.name "Tawin Newsreader Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/version.json data/podcasts.json data/image-cache.json data/publisher-url-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh audio and news editions"
            git push
          fi
